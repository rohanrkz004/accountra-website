<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accountra — AI-Powered Accounting</title>

    <link rel="icon" type="image/png" href="assets/favicon.png">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        .app-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #ffffff;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100vh + 45px);
            border: 0;
            display: block;
        }
    </style>
</head>

<body>

    <div class="app-container">
        <iframe
            src="https://accountingai.streamlit.app/?embed=true"
            title="Accountra">
        </iframe>
    </div>

</body>
</html>
